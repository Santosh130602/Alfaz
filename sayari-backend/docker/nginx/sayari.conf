# ─────────────────────────────────────────────
#  SAYARI PLATFORM — NGINX SITE CONFIG
#  Features:
#   - HTTP → HTTPS redirect
#   - WebSocket (Socket.io) support
#   - Gzip compression
#   - File upload size limits
#   - Request rate limiting zones
#   - Static file caching headers
# ─────────────────────────────────────────────

# Rate limiting zones (defined in nginx.conf, used here)
# limit_req_zone defined in nginx.conf

# ── HTTP → HTTPS redirect ─────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.sayari.app;    # Change to your domain

    # ── SSL certificates ──────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # ── Security headers ──────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upload size ───────────────────────────
    client_max_body_size 110m;   # Allow up to 110mb (audio files up to 100mb)
    client_body_timeout  120s;
    client_header_timeout 30s;

    # ── Gzip ──────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # ── Health endpoints (no rate limit) ──────
    location ~ ^/(health|ready|live)$ {
        proxy_pass         http://sayari_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        access_log off;
    }

    # ── WebSocket (Socket.io) ─────────────────
    location /socket.io/ {
        proxy_pass         http://sayari_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;   # Keep WS connections alive
        proxy_send_timeout 86400s;
    }

    # ── Auth endpoints (strict rate limit) ────
    location ~ ^/api/v1/auth/(login|register|whatsapp) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://sayari_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Upload endpoints (relaxed timeout) ────
    location ~ ^/api/v1/(posts|series|upload|templates|assets) {
        proxy_pass          http://sayari_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;       # Longer timeout for file uploads
        proxy_send_timeout  120s;
    }

    # ── All other API routes ──────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass          http://sayari_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Correlation-ID  $request_id;
        proxy_read_timeout  30s;
        proxy_connect_timeout 10s;
    }

    # ── Default (404 for anything else) ───────
    location / {
        return 404 '{"success":false,"code":"ROUTE_NOT_FOUND","message":"Not found"}';
        add_header Content-Type application/json;
    }
}

# ── Upstream ──────────────────────────────────
upstream sayari_api {
    server api:4000;
    keepalive 32;
}
