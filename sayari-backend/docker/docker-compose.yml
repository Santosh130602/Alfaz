# version: '3.9'

services:

  mongo:
    image: mongo:7.0
    container_name: sayari_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: sayari
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - sayari_net
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')","--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: sayari_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass abc123
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - sayari_net
    healthcheck:
      # test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-redis_secret}","ping"]
      test: ["CMD","redis-cli","-a","abc123","ping"] 
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: sayari_api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../.env
    environment:
      # MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/sayari?authSource=admin
      # MONGODB_URI : ${MONGODB_URI}
      # REDIS_URL: ${REDIS_URL}
      # REDIS_HOST: ${REDIS_HOST}
      # REDIS_PORT: ${REDIS_PORT}

      MONGODB_URI : mongodb+srv://solankihimani2501_db_user:qaT0gox8ZPPDZGIe@cluster0.njuoqoa.mongodb.net/sayari
      REDIS_URL: redis://:abc123@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMIUM_PATH: /usr/bin/chromium-browser
      PUPPETEER_SKIP_DOWNLOAD: "true"
      LOG_DIR: /app/logs
    ports:
      - "4000:4000"
    volumes:
      - api_logs:/app/logs
    networks:
      - sayari_net
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: sayari_nginx
  #   restart: unless-stopped
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/sayari.conf:/etc/nginx/conf.d/default.conf:ro
  #     - nginx_certs:/etc/nginx/certs
  #     - nginx_logs:/var/log/nginx
  #   networks:
  #     - sayari_net

volumes:
  mongo_data:
  redis_data:
  api_logs:
  # nginx_certs:
  # nginx_logs:

networks:
  sayari_net:
    driver: bridge
